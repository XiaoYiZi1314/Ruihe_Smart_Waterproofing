<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>瑞和智慧防水</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #f4f6fa 0%, #e8eefc 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      color: #1f2937;
    }
    .card {
      text-align: center;
      padding: 64px 48px;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(26, 92, 255, 0.12);
      max-width: 420px;
    }
    .logo {
      width: 88px;
      height: 88px;
      margin: 0 auto 24px;
      border-radius: 24px;
      background: linear-gradient(135deg, #1A5CFF, #5B9AF5);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 40px;
      font-weight: 700;
    }
    h1 { font-size: 24px; margin-bottom: 8px; }
    .sub { font-size: 14px; color: #6b7280; margin-bottom: 32px; }
    a.btn {
      display: inline-block;
      padding: 14px 40px;
      border-radius: 24px;
      background: linear-gradient(135deg, #2B7BE4, #1A5CFF);
      color: #ffffff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
    }
    .tip { margin-top: 28px; font-size: 12px; color: #9ca3af; line-height: 1.7; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">瑞</div>
    <h1>瑞和智慧防水</h1>
    <p class="sub">专业防水堵漏预约服务系统</p>
    <a class="btn" href="/admin/">进入管理后台</a>
    <p class="tip">客户服务请使用微信小程序「瑞和智慧」<br/>客服电话：400-888-6688</p>
  </div>
</body>
</html>
